[project]
name = "deepsearch"
version = "0.1.0"
description = "Enterprise deep research and traceable evidence generation platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "langgraph>=0.2",
    "motor>=3.6",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
workflow = [
    "langgraph>=0.2",
]
prod = [
    "celery>=5.3",
    "httpx>=0.27",
    "pgvector>=0.2",
    "psycopg[binary]>=3.1",
    "trafilatura>=1.8",
]
